<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exoplanet Habitability Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">🌍 Exoplanet Habitability Prediction</h2>

    <!-- Input Form -->
    <div class="card p-4">
        <h5>Planet & Host Star Parameters</h5>

        <div class="row g-3">
            <div class="col-md-4">
                <input id="P_RADIUS" class="form-control" placeholder="Planet Radius">
            </div>
            <div class="col-md-4">
                <input id="P_MASS" class="form-control" placeholder="Planet Mass">
            </div>
            <div class="col-md-4">
                <input id="P_DENSITY" class="form-control" placeholder="Planet Density">
            </div>

            <div class="col-md-4">
                <input id="P_SURFACE_TEMP" class="form-control" placeholder="Surface Temperature">
            </div>
            <div class="col-md-4">
                <input id="P_PERIOD" class="form-control" placeholder="Orbital Period">
            </div>
            <div class="col-md-4">
                <input id="P_DISTANCE" class="form-control" placeholder="Distance from Star">
            </div>

            <div class="col-md-4">
                <input id="S_TYPE" class="form-control" placeholder="Star Type (encoded)">
            </div>
            <div class="col-md-4">
                <input id="S_LUMINOSITY" class="form-control" placeholder="Star Luminosity">
            </div>
            <div class="col-md-4">
                <input id="S_TEMPERATURE" class="form-control" placeholder="Star Temperature">
            </div>

            <div class="col-md-4">
                <input id="S_METALLICITY" class="form-control" placeholder="Star Metallicity">
            </div>
        </div>

        <button class="btn btn-primary mt-3" onclick="predict()">Predict Habitability</button>
    </div>

    <!-- Result Section -->
    <div id="result" class="alert alert-info mt-4 d-none"></div>

    <!-- Chart -->
    <div class="card p-4 mt-4">
        <h5>Key Feature Values</h5>
        <canvas id="featureChart"></canvas>
    </div>
</div>

<script src="{{ url_for('static', filename='chart.js') }}"></script>
</body>
</html>
