<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exoplanet Habitability Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">🌍 Exoplanet Habitability Prediction</h2>

    <!-- Input Form -->
    <div class="card p-4">
        <h5>Planet & Host Star Parameters</h5>

        <form id="predictForm" onsubmit="return false;">
            <div class="row g-3">

                <div class="col-md-4">
                    <input type="number" step="any" id="P_RADIUS" class="form-control" placeholder="Planet Radius">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_MASS" class="form-control" placeholder="Planet Mass">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_DENSITY" class="form-control" placeholder="Planet Density">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="P_SURFACE_TEMP" class="form-control" placeholder="Surface Temperature">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_PERIOD" class="form-control" placeholder="Orbital Period">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_DISTANCE" class="form-control" placeholder="Distance from Star">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="S_TYPE" class="form-control" placeholder="Star Type (encoded)">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="S_LUMINOSITY" class="form-control" placeholder="Star Luminosity">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="S_TEMPERATURE" class="form-control" placeholder="Star Temperature">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="S_METALLICITY" class="form-control" placeholder="Star Metallicity">
                </div>
            </div>

            <button type="button" class="btn btn-primary mt-3" onclick="predict()">Predict Habitability</button>
        </form>
    </div>

    <!-- Result Section -->
    <div id="result" class="alert alert-info mt-4 d-none"></div>

    <!-- Chart -->
    <div class="card p-4 mt-4">
        <h5>Key Feature Values</h5>
        <canvas id="featureChart"></canvas>
    </div>
</div>

<!-- Chart helper JS -->
<script src="{{ url_for('static', filename='chart.js') }}"></script>

<script>
let chartInstance = null;

async function predict() {

    const payload = {
        P_RADIUS: Number(P_RADIUS.value),
        P_MASS: Number(P_MASS.value),
        P_DENSITY: Number(P_DENSITY.value),
        P_SURFACE_TEMP: Number(P_SURFACE_TEMP.value),
        P_PERIOD: Number(P_PERIOD.value),
        P_DISTANCE: Number(P_DISTANCE.value),
        S_TYPE: Number(S_TYPE.value),
        S_LUMINOSITY: Number(S_LUMINOSITY.value),
        S_TEMPERATURE: Number(S_TEMPERATURE.value),
        S_METALLICITY: Number(S_METALLICITY.value)
    };

    // Validation
    for (let key in payload) {
        if (isNaN(payload[key])) {
            alert("Please fill all fields correctly");
            return;
        }
    }

    document.getElementById("result").classList.remove("d-none");
    document.getElementById("result").innerHTML = "⏳ Predicting...";

    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-api-key": "habitability_api_2026"
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status !== "success") {
            document.getElementById("result").innerHTML =
                `<span class="text-danger">Error: ${data.message}</span>`;
            return;
        }

        document.getElementById("result").innerHTML = `
            <strong>Prediction:</strong> ${data.prediction_label}<br>
            <strong>Habitability Score:</strong> ${data.habitability_score}<br>
            <strong>Confidence:</strong> ${data.confidence}
        `;

        renderChart(Object.values(payload));

    } catch (error) {
        document.getElementById("result").innerHTML =
            "<span class='text-danger'>Server error. Try again.</span>";
    }
}

function renderChart(values) {
    const ctx = document.getElementById("featureChart");

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels: [
                "Radius", "Mass", "Density", "Temp",
                "Period", "Distance", "Star Type",
                "Luminosity", "Star Temp", "Metallicity"
            ],
            datasets: [{
                label: "Feature Values",
                data: values,
                backgroundColor: "rgba(54, 162, 235, 0.7)"
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}
</script>

</body>
</html>
