<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exoplanet Habitability Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">🌍 Exoplanet Habitability Prediction</h2>

    <!-- Input Form -->
    <div class="card p-4">
        <h5>Planet & Host Star Parameters</h5>

        <form id="predictForm" onsubmit="return false;">
            <div class="row g-3">

                <div class="col-md-4">
                    <input type="number" step="any" id="P_RADIUS" class="form-control" placeholder="Planet Radius">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_MASS" class="form-control" placeholder="Planet Mass">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_DENSITY" class="form-control" placeholder="Planet Density">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="P_SURFACE_TEMP" class="form-control" placeholder="Surface Temperature">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_PERIOD" class="form-control" placeholder="Orbital Period">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="P_DISTANCE" class="form-control" placeholder="Distance from Star">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="S_TYPE" class="form-control" placeholder="Star Type (encoded)">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="S_LUMINOSITY" class="form-control" placeholder="Star Luminosity">
                </div>
                <div class="col-md-4">
                    <input type="number" step="any" id="S_TEMPERATURE" class="form-control" placeholder="Star Temperature">
                </div>

                <div class="col-md-4">
                    <input type="number" step="any" id="S_METALLICITY" class="form-control" placeholder="Star Metallicity">
                </div>
            </div>

            <button type="button" class="btn btn-primary mt-3" onclick="predict()">Predict Habitability</button>
        </form>
    </div>

    <!-- Result Section -->
    <div id="result" class="alert alert-info mt-4 d-none"></div>

    <!-- Chart -->
    <div class="card p-4 mt-4">
        <h5>Key Feature Values</h5>
        <canvas id="featureChart"></canvas>
    </div>
</div>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='chart.js') }}"></script>

<script>
let chartInstance = null;

function predict() {
    const values = [
        Number(P_RADIUS.value),
        Number(P_MASS.value),
        Number(P_DENSITY.value),
        Number(P_SURFACE_TEMP.value),
        Number(P_PERIOD.value),
        Number(P_DISTANCE.value),
        Number(S_TYPE.value),
        Number(S_LUMINOSITY.value),
        Number(S_TEMPERATURE.value),
        Number(S_METALLICITY.value)
    ];

    document.getElementById("result").classList.remove("d-none");
    document.getElementById("result").innerHTML = `
    <strong>Prediction:</strong> ${data.prediction_label}<br>
    <strong>Habitability Score:</strong> ${data.habitability_score}<br>
    <strong>Confidence:</strong> ${data.confidence}
`;


    renderChart(values);
}

function renderChart(values) {
    const ctx = document.getElementById("featureChart");

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels: [
                "Radius", "Mass", "Density", "Temp",
                "Period", "Distance", "Star Type",
                "Luminosity", "Star Temp", "Metallicity"
            ],
            datasets: [{
                label: "Feature Values",
                data: values,
                backgroundColor: "rgba(54, 162, 235, 0.7)"
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}
</script>

</body>
</html>
